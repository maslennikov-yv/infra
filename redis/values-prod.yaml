# Valkey (официальный чарт valkey-io/valkey-helm, vendored в redis/valkey) вместо Bitnami Redis.
# Образ valkey-bundle — Valkey + модули valkey-json/valkey-search (замена ReJSON/RediSearch).
# Пароль админа (user default) — из того же Secret redis/redis (ключ redis-password), что и раньше;
# пользователи приложений — auth.aclConfig из overlay redis/values-<ENV>.acl.yaml
# (scripts/redis-build-acl-overlay.sh), живое применение — scripts/redis-acl-reconcile.sh.

image:
  registry: localhost:32000
  repository: valkey/valkey-bundle
  tag: "9.1.3-trixie"

# PVC RWO: RollingUpdate поднял бы новый под раньше, чем старый отпустит том.
deploymentStrategy: Recreate

dataStorage:
  enabled: true
  requestedSize: 4Gi
  className: ""
  # PVC переживает helm uninstall (данные не теряются при пересоздании релиза).
  keepPvc: true

auth:
  enabled: true
  usersExistingSecret: redis
  aclUsers:
    default:
      permissions: "~* &* +@all"
      passwordKey: redis-password

# Логические БД для REDIS_DB в app-redis Secret (см. docs/pg-app.md): в реестре закрепляйте с 1.
valkeyConfig: |-
  databases 128
  loadmodule /usr/lib/valkey/libjson.so
  loadmodule /usr/lib/valkey/libsearch.so
  appendonly yes
  save ""

# Ресурсы — как были у Bitnami master в prod.
resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

metrics:
  enabled: true
  exporter:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
    image:
      registry: localhost:32000
      repository: oliver006/redis_exporter
      tag: "v1.79.0"

# Эквивалент прежней Bitnami-политики (allowExternal: true, allowExternalEgress: true): вход на
# valkey/метрики от кого угодно, egress не ограничен. Сегментация — docs/runbooks/network-policy.md.
networkPolicy:
  ingress:
    - ports:
        - port: 6379
          protocol: TCP
        - port: 9121
          protocol: TCP
