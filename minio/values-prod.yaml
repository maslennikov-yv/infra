global:
  security:
    allowInsecureImages: true

auth:
  existingSecret: minio
  rootUserSecretKey: root-user
  rootPasswordSecretKey: root-password

image:
  registry: localhost:32000
  repository: bitnami/minio
  tag: "2025.7.23-debian-12-r3"

clientImage:
  registry: localhost:32000
  repository: bitnami/minio-client
  tag: "2025.7.21-debian-12-r2"

console:
  enabled: true
  image:
    registry: localhost:32000
    repository: bitnami/minio-object-browser
    tag: "2.0.2-debian-12-r3"
  # Do not expose Console publicly by default
  ingress:
    enabled: false

defaultInitContainers:
  volumePermissions:
    image:
      registry: localhost:32000
      repository: bitnami/os-shell
      tag: "12-debian-12-r50"

ingress:
  enabled: true
  ingressClassName: nginx
  # Placeholder. Реальный публичный hostname (под который выпущен TLS-сертификат
  # cert-manager) переопределите в minio/values-prod.local.yaml — этот файл
  # gitignored и не попадёт в публичный репозиторий. См. minio/README.md.
  hostname: s3.example.com
  path: /
  pathType: Prefix
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "0"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    cert-manager.io/cluster-issuer: "lets-encrypt"
  tls: true
  extraHosts: []
  extraTls: []

# Standard prod-профиль: standalone (single pod), 50Gi PVC, 512Mi-1Gi памяти.
# При росте нагрузки/объёма — пересмотреть resources.limits и persistence.size.
# Изменение persistence.size — через make minio-recreate-prep
# (см. minio/BACKUP.md: backup-meta + apps-apply воссоздаст IAM/policies; объекты
# в bucket'ах требуют отдельного mc mirror или snapshot PV).
#
# standalone ⇒ чарт разворачивает Deployment (не StatefulSet, см.
# minio/templates/application.yaml). При одной реплике `RollingUpdate` с
# `maxSurge: 25%` округляется вверх до 1: новый под стартует ДО завершения старого, а
# `ReadWriteOnce` ограничивает том узлом, а не подом — на hostpath оба пода садятся на
# один каталог данных. Два процесса MinIO на одном data dir не поддерживаются, поэтому
# здесь Recreate: короткий простой хранилища вместо риска порчи метаданных бакетов.
# `rollingUpdate: null` обязателен — иначе API отклонит апгрейд, живой объект держит
# rollingUpdate от дефолтов, а helm-патч его не снимет. Замеры цены окна и списка
# затронутых потребителей — в minio/values-rocket.yaml (там это проверено на живом
# кластере; ЭТОТ файл описывает окружение prod, а не rocket).
mode: standalone
updateStrategy:
  type: Recreate
  rollingUpdate: null
resources:
  requests:
    cpu: 500m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi
persistence:
  enabled: true
  size: 50Gi
  storageClass: ""

# Prometheus метрики через встроенный MinIO endpoint. Дополнительный exporter не нужен.
# ⚠ В prod ingress включён → endpoint /minio/v2/metrics/cluster и /node будут
# доступны публично при prometheusAuthType: public. Используем jwt — scraper
# должен передавать Bearer-токен админа MinIO. Альтернатива: оставить public и
# заблокировать /minio/v2/metrics/ через nginx server-snippet annotation.
# См. https://min.io/docs/minio/linux/operations/monitoring/collect-minio-metrics-using-prometheus.html
metrics:
  enabled: true
  prometheusAuthType: jwt

# NetworkPolicy: создаётся chart'ом, но allowExternal: true делает её
# фактически noop. Для жёсткой сегментации — см. docs/runbooks/network-policy.md.
networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true
