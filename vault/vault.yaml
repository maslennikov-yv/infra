apiVersion: v1
kind: ConfigMap
metadata:
  name: vault-config
  namespace: vault
data:
  vault.hcl: |
    storage "file" { path = "/vault/data" }
    listener "tcp" {
      address     = "[::]:8200"
      tls_disable = "true"
    }
    disable_mlock = true
    api_addr      = "http://vault.vault.svc.cluster.local:8200"
    ui            = false
---
apiVersion: v1
kind: Service
metadata:
  name: vault
  namespace: vault
spec:
  selector:
    app: vault
  ports:
    - name: http
      port: 8200
      targetPort: 8200
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vault
  namespace: vault
spec:
  serviceName: vault
  replicas: 1
  selector:
    matchLabels:
      app: vault
  template:
    metadata:
      labels:
        app: vault
    spec:
      securityContext:
        fsGroup: 1000
        runAsUser: 100
        runAsGroup: 1000
      containers:
        - name: vault
          image: hashicorp/vault:1.15.6
          command: ["vault", "server", "-config=/vault/config/vault.hcl"]
          env:
            - name: VAULT_ADDR
              value: "http://127.0.0.1:8200"
            - name: SKIP_SETCAP
              value: "true"
          ports:
            - containerPort: 8200
              name: http
          # Проба спрашивает Vault о его СОСТОЯНИИ, а не о том, слушает ли он порт.
          # Голый tcpSocket считал запечатанный Vault готовым: 2026-08-19 он простоял
          # sealed пять часов, отдавая Ready, пока ota-api уходил в CrashLoopBackOff —
          # ни один индикатор кластера не показывал, где проблема.
          # sealedcode=503 — Vault сам отдаёт 503 на запечатанном, standbyok=true
          # оставлен на случай появления HA (сейчас replicas=1).
          # NotReady у vault-0 = «запечатан»; распечатывает CronJob vault-unseal,
          # который ходит через vault-headless и потому NotReady не боится.
          readinessProbe:
            httpGet:
              path: /v1/sys/health?standbyok=true&sealedcode=503
              port: 8200
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: config
              mountPath: /vault/config
            - name: data
              mountPath: /vault/data
      volumes:
        - name: config
          configMap:
            name: vault-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
